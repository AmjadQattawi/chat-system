<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Rooms</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --bg: #0d0d12;
          --surface: #13131a;
          --surface2: #1a1a24;
          --surface3: #20202d;
          --border: #252535;
          --accent: #6c63ff;
          --accent-glow: rgba(108,99,255,0.15);
          --accent-dim: #4a44b5;
          --text: #dcdcec;
          --text-muted: #7070a0;
          --text-faint: #353550;
          --online: #3dd68c;
          --radius: 14px;
          --radius-sm: 9px;
          --sidebar-w: 260px;
        }

        body {
          font-family: 'IBM Plex Sans Arabic', sans-serif;
          background: var(--bg);
          color: var(--text);
          height: 100vh;
          display: flex;
          overflow: hidden;
          font-size: 14px;
        }

        /* ─── Scrollbar ─── */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        /* ─── Auth Screen ─── */
        #auth-screen {
          position: fixed; inset: 0;
          background: var(--bg);
          display: flex; align-items: center; justify-content: center;
          z-index: 100;
        }
        .auth-card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 18px;
          padding: 2rem 1.75rem;
          width: 320px;
          box-shadow: 0 24px 60px rgba(0,0,0,0.5);
        }
        .auth-logo { font-size: 28px; margin-bottom: 6px; }
        .auth-title { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
        .auth-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 1.5rem; }
        .auth-input {
          width: 100%; padding: 9px 13px; margin-bottom: 9px;
          background: var(--surface2); border: 1px solid var(--border);
          border-radius: var(--radius-sm); color: var(--text);
          font-size: 13px; font-family: inherit; outline: none;
          transition: border-color .2s; direction: rtl;
        }
        .auth-input:focus { border-color: var(--accent); }
        .auth-input::placeholder { color: var(--text-faint); }
        .auth-btn {
          width: 100%; padding: 10px;
          background: var(--accent); border: none;
          border-radius: var(--radius-sm); color: #fff;
          font-size: 13px; font-family: inherit; font-weight: 500;
          cursor: pointer; transition: background .2s; margin-top: 2px;
        }
        .auth-btn:hover { background: var(--accent-dim); }
        .auth-toggle {
          font-size: 12px; color: var(--text-muted);
          text-align: center; margin-top: 12px;
        }
        .auth-toggle span { color: var(--accent); cursor: pointer; }
        #auth-error { font-size: 11.5px; min-height: 16px; margin-bottom: 6px; text-align: center; color: #f87171; }

        /* ─── Sidebar ─── */
        #sidebar {
          width: var(--sidebar-w);
          flex-shrink: 0;
          background: var(--surface);
          border-left: 1px solid var(--border);
          display: flex;
          flex-direction: column;
          height: 100vh;
        }
        .sidebar-header {
          padding: 14px 14px 10px;
          border-bottom: 1px solid var(--border);
          display: flex; align-items: center; justify-content: space-between;
        }
        .app-title { font-size: 14px; font-weight: 600; }
        #status-badge {
          display: inline-flex; align-items: center; gap: 5px;
          font-size: 10.5px; color: var(--text-muted); margin-top: 3px;
        }
        .status-dot {
          width: 6px; height: 6px; border-radius: 50%;
          background: var(--text-faint); transition: background .3s;
        }
        .status-dot.connected { background: var(--online); box-shadow: 0 0 5px var(--online); }
        .btn-logout {
          background: none; border: none; cursor: pointer;
          color: var(--text-faint); font-size: 10.5px; font-family: inherit;
          padding: 4px 7px; border-radius: var(--radius-sm); transition: all .15s;
        }
        .btn-logout:hover { background: var(--surface2); color: #f87171; }

        .create-box {
          padding: 10px 10px;
          border-bottom: 1px solid var(--border);
          display: flex; gap: 7px;
        }
        .create-box input {
          flex: 1; background: var(--surface2);
          border: 1px solid var(--border); border-radius: var(--radius-sm);
          padding: 7px 11px; font-size: 12.5px; font-family: inherit;
          color: var(--text); outline: none; transition: border-color .2s; direction: rtl;
        }
        .create-box input:focus { border-color: var(--accent); }
        .create-box input::placeholder { color: var(--text-faint); }
        .btn-create {
          background: var(--accent); border: none; border-radius: var(--radius-sm);
          width: 32px; height: 32px; cursor: pointer;
          display: flex; align-items: center; justify-content: center; flex-shrink: 0;
          transition: background .2s, transform .15s;
        }
        .btn-create:hover { background: var(--accent-dim); }
        .btn-create:active { transform: scale(0.92); }
        .btn-create svg { width: 13px; height: 13px; stroke: #fff; }

        .rooms-label {
          padding: 9px 14px 4px;
          font-size: 9.5px; font-weight: 600; letter-spacing: 1.2px;
          color: var(--text-muted); text-transform: uppercase;
        }

        #rooms-list { flex: 1; overflow-y: auto; padding: 3px 7px; }

        .room-item {
          display: flex; align-items: center; gap: 8px;
          padding: 7px 8px; border-radius: var(--radius-sm);
          cursor: pointer; transition: background .15s; position: relative;
          margin-bottom: 1px;
        }
        .room-item:hover { background: var(--surface2); }
        .room-item.active { background: var(--accent-glow); }
        .room-item.active .room-name { color: var(--accent); }
        .room-avatar {
          width: 30px; height: 30px; border-radius: 8px;
          background: var(--surface2); border: 1px solid var(--border);
          display: flex; align-items: center; justify-content: center;
          font-size: 13px; flex-shrink: 0; transition: border-color .2s;
        }
        .room-item.active .room-avatar { border-color: var(--accent); }
        .room-name { font-size: 12.5px; font-weight: 500; }
        .room-item.active::before {
          content: ''; position: absolute; right: 0; top: 50%;
          transform: translateY(-50%); width: 2.5px; height: 55%;
          background: var(--accent); border-radius: 2px 0 0 2px;
        }
        .empty-rooms {
          padding: 18px 14px; text-align: center;
          color: var(--text-faint); font-size: 12px; line-height: 1.8;
        }
        .user-bar {
          padding: 9px 12px; border-top: 1px solid var(--border);
          display: flex; align-items: center; gap: 8px;
        }
        .user-avatar {
          width: 26px; height: 26px; border-radius: 50%;
          background: var(--accent-glow); border: 1px solid var(--accent);
          display: flex; align-items: center; justify-content: center;
          font-size: 11px; flex-shrink: 0;
        }
        .user-name { font-size: 12px; font-weight: 500; flex: 1; }

        /* ─── Main ─── */
        #main { flex: 1; display: flex; flex-direction: column; height: 100vh; min-width: 0; }

        #placeholder {
          flex: 1; display: flex; flex-direction: column;
          align-items: center; justify-content: center; gap: 10px;
        }
        #placeholder svg { opacity: 0.07; }
        #placeholder p { font-size: 13px; color: var(--text-faint); }

        #chat-panel { display: none; flex-direction: column; height: 100vh; }

        .chat-header {
          padding: 11px 18px; border-bottom: 1px solid var(--border);
          display: flex; align-items: center; gap: 10px;
          background: var(--surface); flex-shrink: 0;
        }
        .chat-room-avatar {
          width: 32px; height: 32px; border-radius: 8px;
          background: var(--accent-glow); border: 1px solid var(--accent);
          display: flex; align-items: center; justify-content: center; font-size: 14px;
        }
        .chat-room-name { font-size: 13px; font-weight: 600; }
        .chat-room-sub { font-size: 10.5px; color: var(--text-muted); margin-top: 1px; }

        #messages {
          flex: 1; overflow-y: auto;
          padding: 14px 14px; display: flex; flex-direction: column; gap: 6px;
        }

        .msg-wrap {
          display: flex; flex-direction: column;
          max-width: 62%; animation: fadeUp .2s ease;
        }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(6px); }
          to   { opacity: 1; transform: translateY(0); }
        }
        .msg-wrap.me    { align-self: flex-start; }
        .msg-wrap.other { align-self: flex-end; }

        .msg-sender {
          font-size: 9.5px; color: var(--text-muted);
          margin-bottom: 3px; padding: 0 4px;
        }
        .msg-wrap.me .msg-sender { text-align: right; }

        .msg-bubble {
          padding: 8px 12px; border-radius: 11px;
          font-size: 13px; line-height: 1.55; word-break: break-word;
        }
        .msg-wrap.me    .msg-bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
        .msg-wrap.other .msg-bubble { background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 3px; }

        .msg-time {
          font-size: 9.5px; color: var(--text-faint);
          margin-top: 3px; padding: 0 4px;
        }
        .msg-wrap.other .msg-time { text-align: left; }

        /* ─── Typing indicator ─── */
        #typing-indicator {
          height: 18px;
          padding: 0 14px 2px;
          font-size: 11px;
          color: var(--text-muted);
          font-style: italic;
          flex-shrink: 0;
          transition: opacity .2s;
          display: flex; align-items: center; gap: 6px;
        }
        .typing-dots {
          display: inline-flex; gap: 3px; align-items: center;
        }
        .typing-dots span {
          width: 4px; height: 4px; border-radius: 50%;
          background: var(--text-muted);
          animation: dotBounce 1.2s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: .2s; }
        .typing-dots span:nth-child(3) { animation-delay: .4s; }
        @keyframes dotBounce {
          0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
          40% { opacity: 1; transform: scale(1); }
        }

        /* ─── Input Bar ─── */
        .input-bar {
          padding: 10px 13px;
          border-top: 1px solid var(--border);
          display: flex; gap: 9px; align-items: center;
          background: var(--surface); flex-shrink: 0;
        }
        .msg-input {
          flex: 1; background: var(--surface2);
          border: 1px solid var(--border); border-radius: 20px;
          padding: 9px 15px; font-size: 13px; font-family: inherit;
          color: var(--text); outline: none; transition: border-color .2s; direction: rtl;
        }
        .msg-input:focus { border-color: var(--accent); }
        .msg-input::placeholder { color: var(--text-faint); }
        .btn-send {
          background: var(--accent); border: none; border-radius: 50%;
          width: 36px; height: 36px; cursor: pointer;
          display: flex; align-items: center; justify-content: center; flex-shrink: 0;
          transition: background .2s, transform .15s;
        }
        .btn-send:hover { background: var(--accent-dim); }
        .btn-send:active { transform: scale(0.9); }
        .btn-send svg { width: 15px; height: 15px; stroke: #fff; }

        /* ─── Toast ─── */
        #toast {
          position: fixed; bottom: 20px; left: 50%;
          transform: translateX(-50%) translateY(16px);
          background: var(--surface2); border: 1px solid var(--border);
          border-radius: 20px; padding: 7px 16px;
          font-size: 12px; color: var(--text-muted);
          opacity: 0; transition: all .3s; pointer-events: none; white-space: nowrap;
        }
        #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* ─── Join button ─── */
        .join-btn {
          font-size: 10.5px; padding: 3px 9px;
          background: var(--accent); border: none; border-radius: 5px;
          color: #fff; cursor: pointer; font-family: inherit; font-weight: 500;
        }
        .join-btn:hover { background: var(--accent-dim); }
    </style>
</head>
<body>

<!-- ─── Auth Screen ─── -->
<div id="auth-screen">
    <div class="auth-card">
        <div class="auth-logo">💬</div>
        <div class="auth-title">Chat Rooms</div>
        <div class="auth-sub" id="auth-sub">أهلاً! سجّل دخولك للمتابعة</div>
        <input class="auth-input" id="auth-username" placeholder="اسم المستخدم" onkeydown="if(event.key==='Enter') submitAuth()">
        <input class="auth-input" id="auth-password" type="password" placeholder="كلمة المرور" onkeydown="if(event.key==='Enter') submitAuth()">
        <div id="auth-error"></div>
        <button class="auth-btn" onclick="submitAuth()" id="auth-btn">دخول</button>
        <div class="auth-toggle" id="auth-toggle">
            ما عندك حساب؟ <span onclick="toggleMode()">سجّل الآن</span>
        </div>
    </div>
</div>

<!-- ─── Sidebar ─── -->
<div id="sidebar">
    <div class="sidebar-header">
        <div>
            <div class="app-title">💬 Chat Rooms</div>
            <div id="status-badge">
                <div class="status-dot" id="dot"></div>
                <span id="status-text">جاري الاتصال...</span>
            </div>
        </div>
        <button class="btn-logout" onclick="logout()">خروج ↩</button>
    </div>

    <div class="create-box">
        <input id="roomName" placeholder="اسم غرفة جديدة..." onkeydown="if(event.key==='Enter') createRoom()">
        <button class="btn-create" onclick="createRoom()">
            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </button>
    </div>

    <div class="rooms-label">الغرف</div>
    <div id="rooms-list">
        <div class="empty-rooms">لا توجد غرف بعد<br>أنشئ واحدة ☝️</div>
    </div>

    <div class="user-bar">
        <div class="user-avatar">👤</div>
        <div class="user-name" id="user-name-display">—</div>
    </div>
</div>

<!-- ─── Main ─── -->
<div id="main">
    <div id="placeholder">
        <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        </svg>
        <p>اختر غرفة للبدء</p>
    </div>

    <div id="chat-panel">
        <div class="chat-header">
            <div class="chat-room-avatar" id="chat-avatar">💬</div>
            <div>
                <div class="chat-room-name" id="chat-room-name">—</div>
                <div class="chat-room-sub">غرفة دردشة عامة</div>
            </div>
        </div>

        <div id="messages"></div>

        <!-- Typing indicator -->
        <div id="typing-indicator"></div>

        <div class="input-bar">
            <button class="btn-send" onclick="sendMessage()">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"/>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                </svg>
            </button>
            <input
                    class="msg-input"
                    id="msg"
                    placeholder="اكتب رسالة..."
                    oninput="onMessageInput()"
                    onkeydown="if(event.key==='Enter') sendMessage()"
            >
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let token  = localStorage.getItem('jwt_token');
    let myName = localStorage.getItem('username');
    let isRegisterMode = false;
    let stompClient = null;
    let currentRoomId = null;
    let currentSubscription = null;
    let typingSubscription = null;
    const emojis = ["💬","🔥","🎯","🚀","⚡","🌟","🎮","🎨","🌙","🌈"];

    // ── Typing state ──
    let typingTimeout = null;
    let isTyping = false;

    // ── Init ──
    if (token && myName) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('user-name-display').textContent = myName;
        connect();
    }

    // ── Toggle Login/Register ──
    function toggleMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-btn').textContent  = isRegisterMode ? 'إنشاء حساب' : 'دخول';
        document.getElementById('auth-sub').textContent  = isRegisterMode ? 'أنشئ حساباً جديداً' : 'أهلاً! سجّل دخولك للمتابعة';
        document.getElementById('auth-toggle').innerHTML = isRegisterMode
            ? 'عندك حساب؟ <span onclick="toggleMode()">سجّل دخول</span>'
            : 'ما عندك حساب؟ <span onclick="toggleMode()">سجّل الآن</span>';
        document.getElementById('auth-error').textContent = '';
    }

    // ── Auth ──
    async function submitAuth() {
        const username = document.getElementById('auth-username').value.trim();
        const password = document.getElementById('auth-password').value.trim();
        const errEl    = document.getElementById('auth-error');
        errEl.style.color = '#f87171';

        if (!username || !password) { errEl.textContent = 'يرجى تعبئة جميع الحقول'; return; }

        const url = isRegisterMode ? '/register' : '/login';
        try {
            const res = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userName: username, password })
            });

            if (!res.ok) {
                errEl.textContent = isRegisterMode ? 'اسم المستخدم مستخدم مسبقاً' : 'اسم المستخدم أو كلمة المرور غلط';
                return;
            }

            if (isRegisterMode) {
                toggleMode();
                errEl.style.color = '#3dd68c';
                errEl.textContent = 'تم إنشاء الحساب ✔ سجّل دخولك الآن';
                return;
            }

            const jwt = await res.text();
            localStorage.setItem('jwt_token', jwt);
            localStorage.setItem('username', username);
            token  = jwt;
            myName = username;

            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('user-name-display').textContent = myName;
            connect();

        } catch (e) {
            errEl.textContent = 'خطأ في الاتصال بالسيرفر';
        }
    }

    // ── Logout ──
    function logout() {
        localStorage.removeItem('jwt_token');
        localStorage.removeItem('username');
        location.reload();
    }

    // ── Auth Fetch ──
    function authFetch(url, options = {}) {
        return fetch(url, {
            ...options,
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
                ...(options.headers || {})
            }
        });
    }

    // ── WebSocket Connect ──
    function connect() {
        const socket = new SockJS('/ws');
        stompClient  = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect(
            { 'Authorization': 'Bearer ' + token },
            function () {
                document.getElementById('dot').classList.add('connected');
                document.getElementById('status-text').textContent = 'متصل ✔';
                loadRooms();
            },
            function () {
                document.getElementById('status-text').textContent = 'فشل الاتصال ❌';
            }
        );
    }

    // ── Load Rooms ──
    async function loadRooms() {
        try {
            const res   = await authFetch('/api/rooms');
            const rooms = await res.json();
            renderRooms(rooms);
        } catch (e) { console.error('loadRooms error:', e); }
    }

    function renderRooms(rooms) {
        const list = document.getElementById('rooms-list');
        if (!rooms.length) {
            list.innerHTML = '<div class="empty-rooms">لا توجد غرف بعد<br>أنشئ واحدة ☝️</div>';
            return;
        }
        list.innerHTML = '';
        rooms.forEach(r => {
            const div = document.createElement('div');
            div.className = 'room-item' + (r.id == currentRoomId ? ' active' : '');

            if (r.member) {
                div.innerHTML = `
                    <div class="room-avatar">${emojis[r.id % emojis.length]}</div>
                    <div class="room-name">${r.name}</div>`;
                div.onclick = () => joinRoom(r.id, r.name);
            } else {
                div.style.opacity = '0.55';
                div.innerHTML = `
                    <div class="room-avatar">🔒</div>
                    <div style="flex:1">
                        <div class="room-name">${r.name}</div>
                        <div style="font-size:10.5px;color:var(--text-faint)">غير منضم</div>
                    </div>
                    <button class="join-btn" onclick="requestJoin(event,${r.id})">Join</button>`;
            }
            list.appendChild(div);
        });
    }

    async function requestJoin(event, roomId) {
        event.stopPropagation();
        const res = await authFetch(`/api/rooms/${roomId}/join`, { method: 'POST' });
        if (res.ok) {
            showToast('انضممت للغرفة ✔');
            await loadRooms();
        } else {
            showToast('خطأ في الانضمام');
        }
    }

    // ── Create Room ──
    async function createRoom() {
        const input = document.getElementById('roomName');
        const name  = input.value.trim();
        if (!name) return;
        const res = await authFetch(`/api/rooms?name=${encodeURIComponent(name)}`, { method: 'POST' });
        if (!res.ok) { showToast('الغرفة موجودة مسبقاً!'); return; }
        input.value = '';
        await loadRooms();
        showToast('تم إنشاء الغرفة ✔');
    }

    // ── Join Room ──
    async function joinRoom(roomId, roomName) {
        // Clean up old subscriptions and typing state
        if (currentSubscription)  currentSubscription.unsubscribe();
        if (typingSubscription)   typingSubscription.unsubscribe();
        clearTimeout(typingTimeout);
        isTyping = false;
        hideTypingIndicator();

        currentRoomId = roomId;
        await loadRooms();

        document.getElementById('placeholder').style.display  = 'none';
        document.getElementById('chat-panel').style.display   = 'flex';
        document.getElementById('chat-room-name').textContent = roomName;
        document.getElementById('chat-avatar').textContent    = emojis[roomId % emojis.length];
        document.getElementById('messages').innerHTML         = '';
        document.getElementById('msg').focus();

        // Subscribe to messages
        currentSubscription = stompClient.subscribe(`/topic/room/${roomId}`, msg => {
            addMessage(JSON.parse(msg.body));
        });

        // Subscribe to typing events
        typingSubscription = stompClient.subscribe(`/topic/rooms/${roomId}/typing`, function(message) {
            const event = JSON.parse(message.body);
            if (event.sender === myName) return;
            if (event.typing) {
                showTypingIndicator(event.sender);
            } else {
                hideTypingIndicator();
            }
        });

        // Load history
        const res     = await authFetch(`/api/rooms/${roomId}/messages`);
        const history = await res.json();
        history.forEach(addMessage);
        scrollBottom();
    }

    // ── Typing ──
    function onMessageInput() {
        if (!isTyping) {
            isTyping = true;
            sendTypingEvent(true);
        }
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
            isTyping = false;
            sendTypingEvent(false);
        }, 3000);
    }

    function sendTypingEvent(isCurrentlyTyping) {
        if (!stompClient || !currentRoomId) return;
        stompClient.send(
            `/app/rooms/${currentRoomId}/typing`,
            {},
            JSON.stringify({ typing: isCurrentlyTyping })
        );
    }

    function showTypingIndicator(sender) {
        const el = document.getElementById('typing-indicator');
        el.innerHTML = `
            <div class="typing-dots">
                <span></span><span></span><span></span>
            </div>
            <span>${sender} يكتب...</span>`;
    }

    function hideTypingIndicator() {
        document.getElementById('typing-indicator').innerHTML = '';
    }

    // ── Send Message ──
    function sendMessage() {
        const input = document.getElementById('msg');
        const text  = input.value.trim();
        if (!text || !currentRoomId) return;

        // Stop typing indicator
        clearTimeout(typingTimeout);
        isTyping = false;
        sendTypingEvent(false);

        stompClient.send(`/app/room/${currentRoomId}/send`, {}, JSON.stringify({
            sender: myName, content: text
        }));
        input.value = '';
    }

    // ── Render Message ──
    function addMessage(msg) {
        const isMe = msg.sender === myName;
        const wrap = document.createElement('div');
        wrap.className = `msg-wrap ${isMe ? 'me' : 'other'}`;
        const time = msg.timestamp
            ? new Date(msg.timestamp).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' })
            : new Date().toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit' });
        wrap.innerHTML = `
            ${!isMe ? `<div class="msg-sender">${msg.sender}</div>` : ''}
            <div class="msg-bubble">${msg.content}</div>
            <div class="msg-time">${time}</div>`;
        document.getElementById('messages').appendChild(wrap);
        scrollBottom();
    }

    function scrollBottom() {
        const m = document.getElementById('messages');
        m.scrollTop = m.scrollHeight;
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2500);
    }
</script>
</body>
</html>
