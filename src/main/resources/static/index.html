<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Rooms | Connect</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
          --bg: #0d0d12;
          --surface: #13131a;
          --surface2: #1a1a24;
          --surface3: #20202d;
          --border: #252535;
          --accent: #6c63ff;
          --accent-glow: rgba(108,99,255,0.15);
          --accent-dim: #4a44b5;
          --text: #dcdcec;
          --text-muted: #7070a0;
          --text-faint: #353550;
          --online: #3dd68c;
          --radius: 14px;
          --radius-sm: 9px;
          --sidebar-w: 300px;
        }

        body {
          font-family: 'Inter', sans-serif;
          background: var(--bg);
          color: var(--text);
          height: 100vh;
          display: flex;
          overflow: hidden;
          font-size: 14px;
        }

        /* Sidebar Left */
        #sidebar {
          width: var(--sidebar-w);
          flex-shrink: 0;
          background: var(--surface);
          border-right: 1px solid var(--border);
          display: flex;
          flex-direction: column;
          height: 100vh;
        }

        #main {
          flex: 1;
          display: flex;
          flex-direction: column;
          height: 100vh;
        }

        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .app-title { font-size: 16px; font-weight: 600; }
        #status-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); }
        .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint); }
        .status-dot.connected { background: var(--online); box-shadow: 0 0 8px var(--online); }
        .btn-logout { background: none; border: none; cursor: pointer; color: var(--text-faint); font-size: 11px; transition: color .2s; }
        .btn-logout:hover { color: #f87171; }

        .create-box { padding: 15px; border-bottom: 1px solid var(--border); display: flex; gap: 10px; }
        .create-box input {
          flex: 1; background: var(--surface2); border: 1px solid var(--border);
          border-radius: var(--radius-sm); padding: 10px 14px; color: var(--text); outline: none;
        }
        .create-box input:focus { border-color: var(--accent); }
        .btn-create {
          background: var(--accent); border: none; border-radius: 50%;
          width: 36px; height: 36px; cursor: pointer; display: flex; align-items: center; justify-content: center;
        }

        .rooms-label { padding: 20px 20px 10px; font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; }
        #rooms-list { flex: 1; overflow-y: auto; padding: 0 10px; }

        .room-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 4px; }
        .room-item:hover { background: var(--surface2); }
        .room-item.active { background: var(--accent-glow); border-left: 3px solid var(--accent); }

        .room-avatar { width: 36px; height: 36px; border-radius: 10px; background: var(--surface3); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 16px; }
        .room-name { font-size: 14px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .join-btn { background: var(--accent); border: none; border-radius: 6px; color: #fff; padding: 5px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }

        .user-bar { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; background: var(--surface); margin-top: auto; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent-glow); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; }
        .user-name { font-size: 14px; font-weight: 500; }

        /* ─── Chat Area ─── */
        #placeholder { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0.2; }
        #chat-panel { display: none; flex-direction: column; height: 100vh; }

        .chat-header {
          padding: 15px 25px; border-bottom: 1px solid var(--border);
          display: flex; align-items: center; background: var(--surface);
          justify-content: space-between; /* دفع قائمة المتصلين لليمين */
        }
        .header-meta { display: flex; align-items: center; gap: 15px; }
        .chat-room-avatar { width: 42px; height: 42px; border-radius: 12px; background: var(--accent-glow); border: 1px solid var(--accent); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .chat-room-name { font-size: 16px; font-weight: 600; }
        .chat-room-sub { font-size: 11px; color: var(--text-muted); }

        /* ─── المظهر الجديد الاحترافي للـ Online Users ─── */
        .online-row { display: flex; align-items: center; gap: 6px; padding-left: 15px; }
        .online-pill {
            display: flex; align-items: center; gap: 6px;
            background: var(--surface2); border: 1px solid var(--border);
            padding: 6px 12px; border-radius: 20px; font-size: 12px;
            animation: fadeIn 0.3s ease;
        }
        .online-dot-small { width: 6px; height: 6px; background: var(--online); border-radius: 50%; box-shadow: 0 0 6px var(--online); }

        #messages { flex: 1; overflow-y: auto; padding: 25px; display: flex; flex-direction: column; gap: 12px; }

        .msg-wrap { display: flex; flex-direction: column; max-width: 70%; animation: slideIn 0.3s ease; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }

        .msg-wrap.me { align-self: flex-start; align-items: flex-start; }
        .msg-wrap.other { align-self: flex-end; align-items: flex-end; }

        .msg-sender { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        .msg-bubble { padding: 12px 16px; border-radius: 16px; font-size: 14px; line-height: 1.5; }
        .msg-wrap.me .msg-bubble { background: var(--accent); color: #fff; border-bottom-left-radius: 4px; }
        .msg-wrap.other .msg-bubble { background: var(--surface2); border: 1px solid var(--border); border-bottom-right-radius: 4px; }
        .msg-time { font-size: 10px; color: var(--text-faint); margin-top: 5px; }

        #typing-indicator { height: 30px; padding: 0 25px; font-size: 12px; color: var(--text-muted); font-style: italic; }

        .input-bar { padding: 20px 25px; border-top: 1px solid var(--border); display: flex; gap: 15px; align-items: center; background: var(--surface); }
        .msg-input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: 25px; padding: 12px 20px; color: var(--text); outline: none; font-size: 14px; }
        .btn-send { background: var(--accent); border: none; border-radius: 50%; width: 45px; height: 45px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        #auth-screen { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; }
        .auth-card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 2.5rem 2rem; width: 350px; text-align: center; }
        .auth-input { width: 100%; padding: 12px 15px; margin-bottom: 12px; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); outline: none; }
        .auth-btn { width: 100%; padding: 12px; background: var(--accent); border: none; border-radius: var(--radius-sm); color: #fff; font-weight: 600; cursor: pointer; }
        #toast { position: fixed; top: 25px; left: 50%; transform: translateX(-50%); background: var(--surface3); border: 1px solid var(--accent); padding: 10px 20px; border-radius: 30px; font-size: 13px; z-index: 1000; opacity: 0; transition: all 0.3s; pointer-events: none; }
        #toast.show { opacity: 1; top: 40px; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <div style="font-size: 40px; margin-bottom: 10px;">💬</div>
        <h2 id="auth-title" style="margin-bottom: 20px;">Chat Login</h2>
        <input class="auth-input" id="auth-username" placeholder="Username">
        <input class="auth-input" id="auth-password" type="password" placeholder="Password">
        <div id="auth-error" style="color:#f87171; font-size:12px; margin-bottom:10px"></div>
        <button class="auth-btn" onclick="submitAuth()">Sign In</button>
        <div style="margin-top:15px; font-size:13px; color:var(--text-muted)">
            Need account? <span onclick="toggleMode()" style="color:var(--accent); cursor:pointer">Sign Up</span>
        </div>
    </div>
</div>

<div id="sidebar">
    <div class="sidebar-header">
        <div class="header-top">
            <div class="app-title">Chat Rooms 💬</div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
        <div id="status-badge">
            <div class="status-dot" id="dot"></div>
            <span id="status-text">Connecting...</span>
        </div>
    </div>
    <div class="create-box">
        <input id="roomName" placeholder="New room...">
        <button class="btn-create" onclick="createRoom()">+</button>
    </div>
    <div class="rooms-label">Rooms</div>
    <div id="rooms-list"></div>
    <div class="user-bar">
        <div class="user-avatar">👤</div>
        <div class="user-name" id="user-name-display">Guest</div>
    </div>
</div>

<div id="main">
    <div id="placeholder">
        <h2>Select a room to start chatting</h2>
    </div>
    <div id="chat-panel">
        <div class="chat-header">
            <div class="header-meta">
                <div class="chat-room-avatar" id="chat-avatar">#</div>
                <div>
                    <div class="chat-room-name" id="chat-room-name">General</div>
                    <div class="chat-room-sub">Chatting Area</div>
                </div>
            </div>

            <div class="online-row" id="online-users-list"></div>
        </div>
        <div id="messages"></div>
        <div id="typing-indicator"></div>
        <div class="input-bar">
            <input class="msg-input" id="msg" placeholder="Type a message..." oninput="onMessageInput()">
            <button class="btn-send" onclick="sendMessage()">Send</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    let token = localStorage.getItem('jwt_token');
    let myName = localStorage.getItem('username');
    let activeOnlineUsers = [];
    let isRegisterMode = false;
    let stompClient = null;
    let currentRoomId = null;
    let currentSubscription = null;
    let typingSubscription = null;
    let typingTimeout = null;
    let isTyping = false;
    const emojis = ["🚀", "🔥", "🎯", "⚡", "🌟", "🎮", "🎨", "🌙", "🌈", "💬"];

    if (token && myName) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('user-name-display').textContent = myName;
        connect();
    }

    function toggleMode() {
        isRegisterMode = !isRegisterMode;
        document.getElementById('auth-title').textContent = isRegisterMode ? 'Create Account' : 'Welcome Back';
    }

    async function submitAuth() {
        const u = document.getElementById('auth-username').value.trim();
        const p = document.getElementById('auth-password').value.trim();
        if (!u || !p) return;
        const url = isRegisterMode ? '/register' : '/login';
        try {
            const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ userName: u, password: p }) });
            if (!res.ok) { document.getElementById('auth-error').textContent = 'Error: Invalid login'; return; }
            if (isRegisterMode) { toggleMode(); showToast('Created!'); return; }
            const jwt = await res.text();
            localStorage.setItem('jwt_token', jwt);
            localStorage.setItem('username', u);
            location.reload();
        } catch (e) { console.error(e); }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function authFetch(url, options = {}) {
        return fetch(url, { ...options, headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token, ...(options.headers || {}) } });
    }

    function connect() {
        const socket = new SockJS('/ws');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;
        stompClient.connect({ 'Authorization': 'Bearer ' + token }, () => {
            document.getElementById('dot').classList.add('connected');
            document.getElementById('status-text').textContent = 'Connected';
            loadRooms();
            loadOnlineUsers();
            stompClient.subscribe('/topic/users/status', (msg) => {
                const event = JSON.parse(msg.body);
                if (event.username === myName) return;
                if (event.status === "ONLINE") {
                    if (!activeOnlineUsers.includes(event.username)) activeOnlineUsers.push(event.username);
                } else {
                    activeOnlineUsers = activeOnlineUsers.filter(u => u !== event.username);
                }
                renderOnlineUsers();
            });
        });
    }

    async function loadOnlineUsers() {
        try {
            const res = await authFetch('/api/rooms/online-users');
            activeOnlineUsers = await res.json();
            renderOnlineUsers();
        } catch (e) {}
    }

    // ── طريقة العرض الجديدة (أفقية داخل الهيدر مثل كبسولات الـ Status) ──
    function renderOnlineUsers() {
        const list = document.getElementById('online-users-list');
        list.innerHTML = '';
        activeOnlineUsers.forEach(u => {
            if(u === myName) return;
            const div = document.createElement('div');
            div.className = 'online-pill';
            div.innerHTML = `<div class="online-dot-small"></div><span>${u}</span>`;
            list.appendChild(div);
        });
    }

    function renderRooms(rooms) {
        const list = document.getElementById('rooms-list');
        list.innerHTML = rooms.length ? '' : '<div style="padding:20px; opacity:0.5">No rooms</div>';

        rooms.forEach(r => {
            const div = document.createElement('div');
            div.className = 'room-item' + (r.id == currentRoomId ? ' active' : '');
            const membersBadge = `<span style="font-size: 10px; background: var(--surface3); padding: 2px 6px; border-radius: 10px; color: var(--text-muted); margin-left: auto;">${r.membersCount} members</span>`;

            if (r.member) {
                div.innerHTML = `<div class="room-avatar">${emojis[r.id % emojis.length]}</div><div class="room-name">${r.name}</div>${membersBadge}`;
                div.onclick = () => joinRoom(r.id, r.name);
            } else {
                div.innerHTML = `<div class="room-avatar">🔒</div><div class="room-name">${r.name}</div><button class="join-btn" onclick="requestJoin(event,${r.id})">Join</button>`;
            }
            list.appendChild(div);
        });
    }

    async function loadRooms() {
        try {
            const res = await authFetch('/api/rooms');
            const rooms = await res.json();
            renderRooms(rooms); // تم تعديلها لتنادي renderRooms وتثبت الـ badge بشكل صحيح
        } catch(e) {}
    }

    async function requestJoin(e, id) {
        e.stopPropagation();
        const res = await authFetch(`/api/rooms/${id}/join`, { method: 'POST' });
        if (res.ok) loadRooms();
    }

    async function createRoom() {
        const name = document.getElementById('roomName').value.trim();
        if (!name) return;
        const res = await authFetch(`/api/rooms?name=${encodeURIComponent(name)}`, { method: 'POST' });
        if (res.ok) { document.getElementById('roomName').value = ''; loadRooms(); }
    }

    async function joinRoom(id, name) {
        if (currentSubscription) currentSubscription.unsubscribe();
        if (typingSubscription) typingSubscription.unsubscribe();
        currentRoomId = id;
        loadRooms();
        document.getElementById('placeholder').style.display = 'none';
        document.getElementById('chat-panel').style.display = 'flex';
        document.getElementById('chat-room-name').textContent = name;
        document.getElementById('chat-avatar').textContent = emojis[id % emojis.length];
        document.getElementById('messages').innerHTML = '';
        currentSubscription = stompClient.subscribe(`/topic/room/${id}`, msg => addMessage(JSON.parse(msg.body)));
        typingSubscription = stompClient.subscribe(`/topic/rooms/${id}/typing`, (msg) => {
            const event = JSON.parse(msg.body);
            if (event.sender === myName) return;
            const el = document.getElementById('typing-indicator');
            el.textContent = event.typing ? `${event.sender} is typing...` : '';
        });
        const res = await authFetch(`/api/rooms/${id}/messages`);
        const history = await res.json();
        history.forEach(addMessage);
    }

    function onMessageInput() {
        if (!isTyping) { isTyping = true; sendTyping(true); }
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { isTyping = false; sendTyping(false); }, 3000);
    }

    function sendTyping(typing) {
        if (stompClient && currentRoomId) stompClient.send(`/app/rooms/${currentRoomId}/typing`, {}, JSON.stringify({ typing }));
    }

    function sendMessage() {
        const input = document.getElementById('msg');
        if (!input.value.trim()) return;
        sendTyping(false);
        stompClient.send(`/app/room/${currentRoomId}/send`, {}, JSON.stringify({ sender: myName, content: input.value }));
        input.value = '';
    }

    function addMessage(msg) {
        const isMe = msg.sender === myName;
        const div = document.createElement('div');
        div.className = `msg-wrap ${isMe ? 'me' : 'other'}`;
        div.innerHTML = `
            ${!isMe ? `<div class="msg-sender">${msg.sender}</div>` : ''}
            <div class="msg-bubble">${msg.content}</div>
            <div class="msg-time">${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>`;
        const container = document.getElementById('messages');
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    function showToast(m) {
        const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    document.getElementById('msg').addEventListener('keypress', (e) => { if(e.key === 'Enter') sendMessage(); });
</script>
</body>
</html>
